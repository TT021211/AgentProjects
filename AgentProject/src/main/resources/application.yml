server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: enterprise-agent-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterprise_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent:
  mes:
    enabled: ${MES_DB_ENABLED:true}
    api:
      enabled: ${MES_API_ENABLED:true}
      mes-base-url: ${MES_API_BASE_URL:http://localhost:9977}
      wms-base-url: ${WMS_API_BASE_URL:http://localhost:9213}
      from-source: ${MES_API_FROM_SOURCE:inner}
    datasource:
      url: ${MES_DB_URL:jdbc:mysql://localhost:3306/rsmes_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${MES_DB_USERNAME:root}
      password: ${MES_DB_PASSWORD:root}
      driver-class-name: ${MES_DB_DRIVER:com.mysql.cj.jdbc.Driver}
  model:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
  vector-store:
    base-url: ${QDRANT_BASE_URL:http://localhost:6333}
    collection: ${QDRANT_COLLECTION:enterprise_knowledge}
    embedding-dimension: ${QDRANT_EMBEDDING_DIMENSION:1024}
  feishu:
    webhook-url: ${FEISHU_WEBHOOK_URL:}

logging:
  level:
    com.agententerprise: INFO
