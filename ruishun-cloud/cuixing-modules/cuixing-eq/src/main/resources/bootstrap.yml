# Tomcat
server:
  port: 9909

# Spring
spring:
  application:
    # 应用名称
    name: ruishun-eq
  profiles:
    # 环境配置
    active: ${SPRING_PROFILES_ACTIVE}
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        #测试服务器环境变量：59f36411-3a9b-43ee-848a-d234ce648c25  ip:192.168.9.237
        #电信：2eef24b4-e76e-4e3d-a312-6381a9394741  ip:192.168.50.17
        #lijiang：ea10f8a7-4839-4beb-86ce-b5ddf9c4add3  ip:192.168.50.17
        namespace: ${NACOS_NAMESPACE:ab4ce481-b3b5-4306-b751-2d7484f20620}
#        ip: ${LOCAL_IP_ADDRESS:192.168.9.237}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        # 配置中心地址
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:ab4ce481-b3b5-4306-b751-2d7484f20620}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${SPRING_PROFILES_ACTIVE}.${SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION}
          - ruishun-seata.${SPRING_CLOUD_NACOS_CONFIG_FILE_EXTENSION}
